[project]
name = "flight-to-quality"
version = "0.1.0"
description = "Empirical study of US profit-investment cycles using Tapia's Lotka-Volterra economic model on FRED data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pandas-datareader>=0.10.0",
    "plotly>=6.7.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "pytest>=8.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "playwright>=1.45",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
